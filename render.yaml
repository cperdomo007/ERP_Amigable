services:
  - type: web
    name: pyme-360
    branch: codex/pyme360-v1.5
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: ERP_HOST
        value: 0.0.0.0
      - key: ERP_SERVE_WEB
        value: 'true'
      - key: ERP_FILE_BACKUPS
        value: 'false'
      - key: ERP_SECURE_COOKIES
        value: 'true'
      - key: DATABASE_SSL
        value: 'true'
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL_CA
        sync: false
      - key: ERP_ALLOWED_ORIGINS
        sync: false
